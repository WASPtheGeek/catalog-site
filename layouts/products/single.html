{{ define "main" }}
<section class="section">
  <div class="container">
    <div class="row align-items-center">
      
      <!-- Левая колонка: Изображение оборудования с эффектом пленки -->
      <div class="col-lg-5 col-md-6 mb-4 mb-md-0">
        <div class="product-image-wrapper text-center">
          <img src="{{ .Params.image | relURL }}" class="img-fluid filmed-image" alt="{{ .Title }}" style="max-height: 400px; object-fit: contain;">
        </div>
      </div>

      <!-- Правая колонка: Название и Техническая таблица -->
      <div class="col-lg-7 col-md-6">
        <div class="pl-0 pl-md-4">
          <h1 class="mb-3">{{ .Title }}</h1>
          <p class="lead text-muted mb-4">{{ .Description }}</p>

          {{ if .Params.specifications }}
          <h4 class="h5 mb-3" style="color: #333;">Tehniskā specifikācija</h4>
          <table class="table table-bordered table-hover">
            <tbody>
              {{ range .Params.specifications }}
              <tr>
                <td class="bg-light" style="width: 40%; font-weight: 600;">{{ .name }}</td>
                <td>{{ .value }}</td>
              </tr>
              {{ end }}
            </tbody>
          </table>
          {{ end }}

          <!-- Кнопка заявки (Прямиком на форму Formspree, которую мы защитили) -->
          {{ if .Params.cta.enable }}
          <div class="mt-4">
            <a href="{{ .Params.cta.button_link | relURL }}" class="btn btn-primary px-4 py-2">
              {{ .Params.cta.button_label }}
            </a>
          </div>
          {{ end }}
        </div>
      </div>
      
    </div>

    <!-- Нижний блок: Маркдаун текст (Преимущества, описание) -->
    <div class="row mt-5">
      <div class="col-12">
        <hr class="my-5">
        <div class="content post-description">
          {{ .Content }}
        </div>
      </div>
    </div>
  </div>
</section>
{{ end }}
